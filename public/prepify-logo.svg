<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <!-- Master Gradients -->
    <linearGradient id="prep-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="50%" stop-color="#0A369D" />
      <stop offset="100%" stop-color="#030A1C" />
    </linearGradient>

    <linearGradient id="prep-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE082" />
      <stop offset="100%" stop-color="#FFC107" />
    </linearGradient>

    <linearGradient id="prep-red" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF5252" />
      <stop offset="100%" stop-color="#D9383A" />
    </linearGradient>

    <linearGradient id="prep-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>

    <!-- Glow & Shadow Filters -->
    <filter id="square-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.6"/>
    </filter>

    <filter id="core-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="800" height="800" rx="160" fill="url(#prep-bg)" />

  <!-- Outer Neon Border Ring -->
  <rect x="12" y="12" width="776" height="776" rx="148" fill="none" stroke="url(#prep-gold)" stroke-width="6" stroke-opacity="0.4" />

  <!-- Circuit & Tech Grid Lines Substrate -->
  <g stroke="#FFFFFF" stroke-opacity="0.04" stroke-width="2">
    <line x1="0" y1="200" x2="800" y2="200" />
    <line x1="0" y1="400" x2="800" y2="400" />
    <line x1="0" y1="600" x2="800" y2="600" />
    <line x1="200" y1="0" x2="200" y2="800" />
    <line x1="400" y1="0" x2="400" y2="800" />
    <line x1="600" y1="0" x2="600" y2="800" />
  </g>

  <!-- CENTRAL EMBLEM CONTAINER -->
  <g transform="translate(400, 340)" filter="url(#square-shadow)">
    
    <!-- Outer Dashed Target Ring -->
    <circle cx="0" cy="0" r="220" fill="none" stroke="url(#prep-gold)" stroke-width="10" stroke-dasharray="32 16" filter="url(#core-glow)" />
    
    <!-- Inner Precision Circle -->
    <circle cx="0" cy="0" r="175" fill="#0A369D" stroke="url(#prep-cyan)" stroke-width="5" />

    <!-- Crosshair Target Pins (Hunter Motif) -->
    <line x1="0" y1="-250" x2="0" y2="-195" stroke="#FFC107" stroke-width="8" stroke-linecap="round" />
    <line x1="0" y1="195" x2="0" y2="250" stroke="#FFC107" stroke-width="8" stroke-linecap="round" />
    <line x1="-250" y1="0" x2="-195" y2="0" stroke="#FFC107" stroke-width="8" stroke-linecap="round" />
    <line x1="195" y1="0" x2="250" y2="0" stroke="#FFC107" stroke-width="8" stroke-linecap="round" />

    <!-- Target Corner Sight Brackets -->
    <path d="M -130 -130 L -160 -130 A 10 10 0 0 0 -170 -120 L -170 -90" fill="none" stroke="#38BDF8" stroke-width="6" stroke-linecap="round" />
    <path d="M 130 -130 L 160 -130 A 10 10 0 0 1 170 -120 L 170 -90" fill="none" stroke="#38BDF8" stroke-width="6" stroke-linecap="round" />
    <path d="M -130 130 L -160 130 A 10 10 0 0 1 -170 120 L -170 90" fill="none" stroke="#38BDF8" stroke-width="6" stroke-linecap="round" />
    <path d="M 130 130 L 160 130 A 10 10 0 0 0 170 120 L 170 90" fill="none" stroke="#38BDF8" stroke-width="6" stroke-linecap="round" />

    <!-- Graduation Cap / Mortarboard (Central Icon) -->
    <g transform="translate(0, -15)">
      <!-- Top Diamond Cap -->
      <polygon points="0,-85 130,-15 0,55 -130,-15" fill="url(#prep-gold)" filter="url(#core-glow)" />
      
      <!-- Right Cap Base Shadow -->
      <polygon points="0,55 100,0 100,50 0,105" fill="#D97706" opacity="0.9" />
      
      <!-- Left Cap Base -->
      <polygon points="0,55 -100,0 -100,50 0,105" fill="#F59E0B" />
      
      <!-- Tassel Thread & Bulb -->
      <path d="M 130,-15 L 155,30 L 150,75" fill="none" stroke="url(#prep-red)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
      <circle cx="150" cy="82" r="9" fill="#D9383A" />

      <!-- Center Precision Bullseye Dot -->
      <circle cx="0" cy="-15" r="14" fill="#0A369D" />
      <circle cx="0" cy="-15" r="6" fill="#FFFFFF" />
    </g>

  </g>

  <!-- BRAND NAME TYPOGRAPHY -->
  <g transform="translate(400, 670)" filter="url(#square-shadow)">
    <!-- Main Title -->
    <text x="0" y="0" text-anchor="middle" font-family="'Impact', 'Arial Black', sans-serif" font-size="94" font-weight="900" fill="#FFFFFF" letter-spacing="4">
      PREP<tspan fill="url(#prep-gold)">IFY</tspan>
    </text>

    <!-- Subtitle Pill -->
    <rect x="-170" y="24" width="340" height="34" rx="8" fill="url(#prep-red)" />
    <text x="0" y="47" text-anchor="middle" font-family="'Courier New', monospace" font-size="16" font-weight="900" fill="#FFFFFF" letter-spacing="3">
      UTME CBT SIMULATOR
    </text>
  </g>

  <!-- Status Indicator Badge -->
  <g transform="translate(400, 755)">
    <text x="0" y="0" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#64748B" letter-spacing="2">
      BY IAMADEDO
    </text>
  </g>
</svg>
