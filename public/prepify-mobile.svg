<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0A369D" />
      <stop offset="50%" stop-color="#061E58" />
      <stop offset="100%" stop-color="#030A1C" />
    </linearGradient>

    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFD54F" />
      <stop offset="100%" stop-color="#FFC107" />
    </linearGradient>

    <linearGradient id="red-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF5252" />
      <stop offset="100%" stop-color="#D9383A" />
    </linearGradient>

    <filter id="shadow">
      <feDropShadow dx="0" dy="10" stdDeviation="15" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1080" height="1920" fill="url(#bg-grad)" />

  <!-- Retro Tech Grid Background -->
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="2">
    <pattern id="grid" width="80" height="80" patternUnits="userSpaceOnUse">
      <rect width="80" height="80" fill="none" />
      <path d="M 80 0 L 0 0 0 80" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="2" />
    </pattern>
    <rect width="1080" height="1920" fill="url(#grid)" />
  </g>

  <!-- Top Accent Bar -->
  <rect x="0" y="0" width="1080" height="20" fill="url(#gold-grad)" />

  <!-- HEADER EMBEDDED LOGO -->
  <g transform="translate(140, 140)" filter="url(#shadow)">
    <!-- Target Symbol -->
    <g transform="translate(140, 0)">
      <circle cx="160" cy="160" r="130" fill="none" stroke="url(#gold-grad)" stroke-width="8" stroke-dasharray="20 10" />
      <circle cx="160" cy="160" r="100" fill="#0A369D" stroke="#38BDF8" stroke-width="4" />
      <polygon points="160,80 240,130 160,180 80,130" fill="url(#gold-grad)" />
      <polygon points="160,180 220,145 220,195 160,230" fill="#D97706" />
      <polygon points="160,180 100,145 100,195 160,230" fill="#F59E0B" />
      <circle cx="160" cy="130" r="10" fill="#0A369D" />
    </g>
    <!-- Brand Name -->
    <text x="400" y="500" text-anchor="middle" font-family="'Impact', sans-serif" font-size="110" font-weight="900" fill="#FFFFFF">PREP<tspan fill="url(#gold-grad)">IFY</tspan></text>
    <text x="400" y="550" text-anchor="middle" font-family="monospace" font-size="24" font-weight="bold" fill="#38BDF8" letter-spacing="6">UTME CBT SIMULATION ENGINE</text>
  </g>

  <!-- MAIN HERO TEXT -->
  <g transform="translate(80, 820)" filter="url(#shadow)">
    <rect x="0" y="0" width="920" height="420" rx="24" fill="#0F172A" stroke="#FFC107" stroke-width="4" opacity="0.9" />
    
    <text x="50" y="90" font-family="sans-serif" font-size="44" font-weight="900" fill="#FFC107" uppercase>ACE YOUR JAMB EXAM</text>
    <text x="50" y="160" font-family="sans-serif" font-size="56" font-weight="900" fill="#FFFFFF">100% Authentic CBT</text>
    <text x="50" y="230" font-family="sans-serif" font-size="56" font-weight="900" fill="#FFFFFF">Terminal Experience</text>

    <!-- Feature Checklist -->
    <g transform="translate(50, 280)" font-family="sans-serif" font-size="28" font-weight="bold" fill="#94A3B8">
      <text x="0" y="30" fill="#4ADE80">✓ <tspan fill="#F8FAFC">Standard 8-Key Keyboard Shortcuts</tspan></text>
      <text x="0" y="80" fill="#4ADE80">✓ <tspan fill="#F8FAFC">Biometric WebCam & Noise Proctoring</tspan></text>
    </g>
  </g>

  <!-- ACTION CALLOUT BUTTON -->
  <g transform="translate(140, 1320)" filter="url(#shadow)">
    <rect width="800" height="140" rx="70" fill="url(#red-grad)" />
    <text x="400" y="85" text-anchor="middle" font-family="sans-serif" font-size="42" font-weight="900" fill="#FFFFFF" letter-spacing="2">START PRACTICE NOW</text>
  </g>

  <!-- FOOTER BRANDING SIGNATURE -->
  <g transform="translate(0, 1760)">
    <rect width="1080" height="160" fill="#020617" />
    <line x1="0" y1="0" x2="1080" y2="0" stroke="#FFC107" stroke-width="4" />
    <text x="540" y="70" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#F8FAFC">ENGINEERED FOR ACADEMIC EXCELLENCE</text>
    <text x="540" y="115" text-anchor="middle" font-family="monospace" font-size="22" fill="#FFC107">© 2026 PREPIFY by IamAdedo</text>
  </g>
</svg>
