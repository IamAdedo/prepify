<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%">
  <defs>
    <linearGradient id="dk-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A369D" />
      <stop offset="60%" stop-color="#061E58" />
      <stop offset="100%" stop-color="#020B20" />
    </linearGradient>

    <linearGradient id="dk-gold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFD54F" />
      <stop offset="100%" stop-color="#FFC107" />
    </linearGradient>

    <linearGradient id="dk-red" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF5252" />
      <stop offset="100%" stop-color="#D9383A" />
    </linearGradient>

    <filter id="glow">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1920" height="1080" fill="url(#dk-bg)" />

  <!-- Tech Grid Overlay -->
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1.5">
    <pattern id="dk-grid" width="100" height="100" patternUnits="userSpaceOnUse">
      <rect width="100" height="100" fill="none" />
      <path d="M 100 0 L 0 0 0 100" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1.5" />
    </pattern>
    <rect width="1920" height="1080" fill="url(#dk-grid)" />
  </g>

  <!-- Left Column: Branding & Value Proposition -->
  <g transform="translate(120, 180)">
    <!-- Subtitle Pill -->
    <rect width="380" height="40" rx="20" fill="url(#dk-red)" />
    <text x="20" y="26" font-family="monospace" font-size="16" font-weight="900" fill="#FFFFFF" letter-spacing="3">OFFICIAL UTME CBT SIMULATOR</text>

    <!-- Main Title -->
    <text x="0" y="160" font-family="'Impact', sans-serif" font-size="140" font-weight="900" fill="#FFFFFF">PREP<tspan fill="url(#dk-gold)">IFY</tspan></text>
    
    <!-- Tagline -->
    <text x="0" y="230" font-family="sans-serif" font-size="38" font-weight="800" fill="#38BDF8">Precision Prep. Authentic Experience. Guaranteed Results.</text>
    
    <text x="0" y="300" font-family="serif" font-size="24" fill="#E2E8F0" width="700">
      Master JAMB UTME with exact 8-key hardware navigation, multi-subject practice, 
    </text>
    <text x="0" y="335" font-family="serif" font-size="24" fill="#E2E8F0">
      biometric camera proctoring, and instant 400-point scaled score analytics.
    </text>

    <!-- Keybinding Badge Highlights -->
    <g transform="translate(0, 400)">
      <rect width="680" height="100" rx="16" fill="#0F172A" stroke="#FFC107" stroke-width="2" />
      <text x="30" y="40" font-family="monospace" font-size="16" font-weight="bold" fill="#FFC107">8-KEY KEYBOARD NAVIGATION READY:</text>
      <text x="30" y="75" font-family="monospace" font-size="22" font-weight="900" fill="#FFFFFF">
        [A] [B] [C] [D] <tspan fill="#38BDF8">Option</tspan>  |  [N] <tspan fill="#38BDF8">Next</tspan>  |  [P] <tspan fill="#38BDF8">Prev</tspan>  |  [S] <tspan fill="#FF5252">Submit</tspan>
      </text>
    </g>

    <!-- CTA Button -->
    <g transform="translate(0, 550)">
      <rect width="360" height="80" rx="40" fill="url(#dk-gold)" filter="url(#glow)" />
      <text x="180" y="50" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="900" fill="#0A369D" letter-spacing="1">LAUNCH PORTAL NOW</text>
    </g>
  </g>

  <!-- Right Column: Interactive Terminal Preview Graphic -->
  <g transform="translate(1020, 200)">
    <!-- Terminal Box Frame -->
    <rect width="780" height="580" rx="16" fill="#020617" stroke="#0A369D" stroke-width="8" filter="url(#glow)" />
    
    <!-- Header Bar -->
    <rect width="780" height="50" rx="8" fill="#0A369D" />
    <circle cx="30" cy="25" r="8" fill="#FF5252" />
    <circle cx="55" cy="25" r="8" fill="#FFC107" />
    <circle cx="80" cy="25" r="8" fill="#22C55E" />
    <text x="390" y="32" text-anchor="middle" font-family="monospace" font-size="16" font-weight="bold" fill="#FFFFFF">PREPIFY Terminal - Examination Workspace</text>

    <!-- Inner Terminal Content -->
    <g transform="translate(40, 90)">
      <!-- Question Number -->
      <text x="0" y="30" font-family="sans-serif" font-size="22" font-weight="bold" fill="#FFC107">Question 14 of 40 (Use of English)</text>
      <text x="0" y="80" font-family="serif" font-size="20" fill="#F8FAFC">Choose the option that opposite in meaning to the underlined word:</text>
      <text x="0" y="120" font-family="serif" font-size="22" font-weight="bold" fill="#38BDF8">"The candidate showed <tspan text-decoration="underline">meticulous</tspan> attention to detail."</text>

      <!-- Options Palette -->
      <g transform="translate(0, 160)" font-family="sans-serif" font-size="18">
        <!-- Option A -->
        <rect width="680" height="50" rx="8" fill="#1E293B" stroke="#334155" />
        <text x="20" y="32" font-family="monospace" font-weight="bold" fill="#FFC107">[A]</text>
        <text x="70" y="32" fill="#E2E8F0">Careless</text>

        <!-- Option B Selected -->
        <g transform="translate(0, 65)">
          <rect width="680" height="50" rx="8" fill="#0A369D" stroke="#FFC107" stroke-width="2" />
          <text x="20" y="32" font-family="monospace" font-weight="bold" fill="#FFC107">[B]</text>
          <text x="70" y="32" font-weight="bold" fill="#FFFFFF">Negligent (Selected)</text>
          <circle cx="640" cy="25" r="10" fill="#22C55E" />
        </g>

        <!-- Option C -->
        <g transform="translate(0, 130)">
          <rect width="680" height="50" rx="8" fill="#1E293B" stroke="#334155" />
          <text x="20" y="32" font-family="monospace" font-weight="bold" fill="#FFC107">[C]</text>
          <text x="70" y="32" fill="#E2E8F0">Thorough</text>
        </g>
      </g>
    </g>
  </g>

  <!-- FOOTER ONE-LINE STRIP -->
  <g transform="translate(0, 1000)">
    <rect width="1920" height="80" fill="#020617" />
    <line x1="0" y1="0" x2="1920" y2="0" stroke="#FFC107" stroke-width="3" />
    <text x="960" y="48" text-anchor="middle" font-family="monospace" font-size="20" font-weight="bold" fill="#FFFFFF">
      © 2026, JAMB CBT Portal by IamAdedo | Powered by PREPIFY Engine
    </text>
  </g>
</svg>
