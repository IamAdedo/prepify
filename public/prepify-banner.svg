<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 240" width="100%" height="100%">
  <defs>
    <!-- Master Gradients -->
    <linearGradient id="prepify-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A369D" />
      <stop offset="100%" stop-color="#061E58" />
    </linearGradient>

    <linearGradient id="prepify-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD54F" />
      <stop offset="100%" stop-color="#FFC107" />
    </linearGradient>

    <linearGradient id="prepify-red" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF5252" />
      <stop offset="100%" stop-color="#D9383A" />
    </linearGradient>

    <filter id="drop-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="4" stdDeviation="4" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="800" height="240" rx="16" fill="#071228" />

  <!-- Grid Tech Lines Substrate -->
  <g stroke="#ffffff" stroke-opacity="0.05" stroke-width="1">
    <line x1="0" y1="40" x2="800" y2="40" />
    <line x1="0" y1="80" x2="800" y2="80" />
    <line x1="0" y1="120" x2="800" y2="120" />
    <line x1="0" y1="160" x2="800" y2="160" />
    <line x1="0" y1="200" x2="800" y2="200" />
    <line x1="160" y1="0" x2="160" y2="240" />
    <line x1="320" y1="0" x2="320" y2="240" />
    <line x1="480" y1="0" x2="480" y2="240" />
    <line x1="640" y1="0" x2="640" y2="240" />
  </g>

  <!-- ICON MARK (Left Side) -->
  <g transform="translate(40, 20)" filter="url(#drop-shadow)">
    <!-- Target Sight Outer Ring -->
    <circle cx="100" cy="100" r="82" fill="none" stroke="url(#prepify-gold)" stroke-width="5" stroke-dasharray="12 6" />
    <circle cx="100" cy="100" r="68" fill="url(#prepify-blue)" stroke="#38BDF8" stroke-width="2" />

    <!-- Crosshair Target Pins -->
    <line x1="100" y1="8" x2="100" y2="28" stroke="#FFC107" stroke-width="4" stroke-linecap="round" />
    <line x1="100" y1="172" x2="100" y2="192" stroke="#FFC107" stroke-width="4" stroke-linecap="round" />
    <line x1="8" y1="100" x2="28" y2="100" stroke="#FFC107" stroke-width="4" stroke-linecap="round" />
    <line x1="172" y1="100" x2="192" y2="100" stroke="#FFC107" stroke-width="4" stroke-linecap="round" />

    <!-- Diamond Mortarboard (Graduation Cap / Target Core) -->
    <polygon points="100,52 152,80 100,108 48,80" fill="url(#prepify-gold)" />
    <polygon points="100,108 140,88 140,118 100,138" fill="#D97706" opacity="0.8" />
    <polygon points="100,108 60,88 60,118 100,138" fill="#F59E0B" />
    
    <!-- Tassel Element -->
    <path d="M 152,80 L 162,105 L 160,128" fill="none" stroke="url(#prepify-red)" stroke-width="3" stroke-linecap="round" />
    <circle cx="160" cy="130" r="4" fill="#D9383A" />

    <!-- Center Precision Dot -->
    <circle cx="100" cy="80" r="6" fill="#0A369D" />
    <circle cx="100" cy="80" r="3" fill="#FFFFFF" />
  </g>

  <!-- LOGO TYPOGRAPHY -->
  <g filter="url(#drop-shadow)">
    <!-- PREP Wordmark -->
    <text x="250" y="132" font-family="'Impact', 'Arial Black', sans-serif" font-size="92" font-weight="900" fill="#FFFFFF" letter-spacing="2">PREP</text>
    
    <!-- IFY Suffix Accent -->
    <text x="500" y="132" font-family="'Impact', 'Arial Black', sans-serif" font-size="92" font-weight="900" fill="url(#prepify-gold)" letter-spacing="2">IFY</text>

    <!-- Subtitle / Tagline -->
    <rect x="252" y="152" width="480" height="28" rx="6" fill="url(#prepify-red)" />
    <text x="264" y="171" font-family="'Courier New', monospace" font-size="14" font-weight="800" fill="#FFFFFF" letter-spacing="3">HIGH-FIDELITY UTME CBT SIMULATOR</text>
  </g>

  <!-- High-Tech Status Pill -->
  <g transform="translate(640, 25)">
    <rect width="120" height="24" rx="12" fill="#1E293B" stroke="#FFC107" stroke-width="1" />
    <circle cx="14" cy="12" r="4" fill="#22C55E" />
    <text x="26" y="16" font-family="sans-serif" font-size="10" font-weight="bold" fill="#F8FAFC">v1.0 ONLINE</text>
  </g>
</svg>
